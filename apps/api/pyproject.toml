[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AJ RIENZE", email = "labradarenz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "fastapi>=0.143.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
